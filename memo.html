<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猪猪备忘录 📝</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; min-height: 100%;
            background: linear-gradient(180deg, #ffdde1 0%, #ee9ca7 100%);
            font-family: 'Microsoft YaHei', sans-serif;
            display: flex; flex-direction: column; align-items: center;
        }

        /* --- 返回按钮 --- */
        .back-btn {
            position: absolute; top: 20px; left: 20px;
            text-decoration: none; font-size: 1.2em;
            background: rgba(255,255,255,0.6); padding: 8px 15px;
            border-radius: 20px; color: #ff6b81; font-weight: bold;
            transition: all 0.3s;
        }
        .back-btn:hover { background: white; transform: scale(1.05); }

        /* --- 主容器 --- */
        .container {
            margin-top: 80px; width: 90%; max-width: 500px;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(10px);
            padding: 30px; border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h1 { text-align: center; color: #ff6b81; margin-top: 0; }

        /* --- 输入框区域 --- */
        .input-area { display: flex; gap: 10px; margin-bottom: 20px; }
        input {
            flex: 1; padding: 12px; border: 2px solid #eee; border-radius: 10px;
            font-size: 16px; outline: none;
        }
        input:focus { border-color: #ff6b81; }
        button {
            padding: 0 20px; border: none; background: #ff6b81; color: white;
            border-radius: 10px; font-weight: bold; cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); }

        /* --- 列表区域 --- */
        ul { list-style: none; padding: 0; }
        li {
            background: white; border-bottom: 1px solid #eee;
            padding: 15px; display: flex; align-items: center; justify-content: space-between;
            transition: all 0.2s;
        }
        li:first-child { border-top-left-radius: 10px; border-top-right-radius: 10px; }
        li:last-child { border-bottom-left-radius: 10px; border-bottom-right-radius: 10px; border-bottom: none; }
        
        li:hover { background: #fffdfd; }

        .task-text { flex: 1; margin-left: 10px; font-size: 16px; color: #555; cursor: pointer;}
        .completed .task-text { text-decoration: line-through; color: #bbb; }
        
        .delete-btn {
            background: transparent; color: #ccc; font-size: 18px; padding: 5px;
        }
        .delete-btn:hover { color: #ff4757; transform: scale(1.2); }

    </style>
</head>
<body>

    <a href="index.html" class="back-btn">🏡 返回导航</a>

    <div class="container">
        <h1>📝 猪猪备忘录</h1>
        
        <div class="input-area">
            <input type="text" id="taskInput" placeholder="今天要做什么鸭？" onkeypress="handleEnter(event)">
            <button onclick="addTask()">添加</button>
        </div>

        <ul id="taskList">
            </ul>
    </div>

    <script>
        // 页面加载时读取数据
        window.onload = function() {
            const savedTasks = JSON.parse(localStorage.getItem('piggy_tasks')) || [];
            savedTasks.forEach(task => renderTask(task.text, task.completed));
        };

        function handleEnter(e) {
            if (e.key === 'Enter') addTask();
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const text = input.value.trim();
            if (!text) return;

            renderTask(text, false);
            saveData();
            input.value = ''; // 清空输入框
        }

        function renderTask(text, completed) {
            const ul = document.getElementById('taskList');
            const li = document.createElement('li');
            if (completed) li.classList.add('completed');

            li.innerHTML = `
                <span style="cursor:pointer" onclick="toggleTask(this)">${completed ? '✅' : '⬜'}</span>
                <span class="task-text" onclick="toggleTask(this)">${text}</span>
                <button class="delete-btn" onclick="deleteTask(this)">🗑️</button>
            `;
            ul.appendChild(li);
        }

        function toggleTask(element) {
            const li = element.parentElement;
            li.classList.toggle('completed');
            
            // 更新前面的图标
            const iconSpan = li.children[0];
            iconSpan.innerText = li.classList.contains('completed') ? '✅' : '⬜';
            
            saveData();
        }

        function deleteTask(element) {
            element.parentElement.remove();
            saveData();
        }

        function saveData() {
            const tasks = [];
            document.querySelectorAll('li').forEach(li => {
                tasks.push({
                    text: li.querySelector('.task-text').innerText,
                    completed: li.classList.contains('completed')
                });
            });
            localStorage.setItem('piggy_tasks', JSON.stringify(tasks));
        }
    </script>
</body>
</html>
