<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>给最可爱的小猪猪 🐷💖</title>
    <style>
        /* 全局样式 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* 防止滚动条出现 */
            background: linear-gradient(180deg, #ffdde1 0%, #ee9ca7 100%); /* 粉色渐变背景 */
            font-family: 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* 中间卡片样式 */
        .card {
            background: rgba(255, 255, 255, 0.8);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(255, 105, 135, 0.3);
            text-align: center;
            z-index: 10; /* 保证卡片在飘落物上方 */
            backdrop-filter: blur(5px);
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .card:hover {
            transform: scale(1.05);
        }

        /* 中间的小猪猪头像/Emoji */
        .piggy-icon {
            font-size: 80px;
            display: inline-block;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        h1 {
            color: #ff6b81;
            margin: 0;
            font-size: 2em;
        }

        p {
            color: #ff8fa3;
            font-size: 1.2em;
            margin-top: 10px;
        }

        /* 飘落元素的样式 */
        .falling-item {
            position: absolute;
            top: -50px;
            user-select: none;
            pointer-events: none; /* 让鼠标穿透，不影响点击 */
            animation: fall linear forwards;
        }

        /* 动画定义 */
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-20px);}
            60% {transform: translateY(-10px);}
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg); /* 掉落到底部并旋转 */
            }
        }

        /* 手机端适配 */
        @media (max-width: 600px) {
            .card {
                padding: 20px;
                width: 80%;
            }
            .piggy-icon {
                font-size: 60px;
            }
            h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>

    <div class="card" onclick="burstHearts()">
        <div class="piggy-icon">🐷</div>
        <h1>专属小猪猪的网页</h1>
        <p>每天都要开开心心哒！💖</p>
        <p style="font-size: 0.8em; color: #aaa;">(点击小猪有惊喜哦)</p>
    </div>

    <script>
        // 定义飘落的元素库：可以是Emoji，也可以是图片链接
        const items = ['❤️', '💖', '🐷', '🐽', '💕', '✨'];

        // 创建飘落元素的函数
        function createFallingItem() {
            const item = document.createElement('div');
            item.classList.add('falling-item');
            
            // 随机选择一个图标
            item.innerText = items[Math.floor(Math.random() * items.length)];

            // 随机大小 (20px 到 40px)
            const size = Math.random() * 20 + 20; 
            item.style.fontSize = size + 'px';

            // 随机水平位置 (0% 到 100%)
            item.style.left = Math.random() * 100 + 'vw';

            // 随机动画时长 (3s 到 8s)，营造远近感
            const duration = Math.random() * 5 + 3;
            item.style.animationDuration = duration + 's';

            // 添加到页面
            document.body.appendChild(item);

            // 动画结束后移除元素，防止页面卡顿
            setTimeout(() => {
                item.remove();
            }, duration * 1000);
        }

        // 启动自动飘落：每300毫秒生成一个
        setInterval(createFallingItem, 300);

        // 点击爆发生效函数
        function burstHearts() {
            // 瞬间生成15个元素
            for(let i=0; i<15; i++) {
                setTimeout(createFallingItem, i * 50);
            }
            // 让中间的猪猪震动一下
            const pig = document.querySelector('.piggy-icon');
            pig.style.transform = "scale(1.5)";
            setTimeout(() => {
                pig.style.transform = "scale(1)";
            }, 200);
        }
    </script>
</body>
</html>
