<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的猪猪导航 🐷</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="header-section">
        <div class="piggy-icon" id="piggy" onclick="triggerPigRain()">🐷</div>
        <div class="clock-container">
            <div class="time-text" id="clock-time">00:00</div>
            <div class="date-text" id="clock-date">Loading...</div>
            <div class="greeting-text" id="clock-greet">你好呀 🐽</div>
            
            <div class="love-container" style="margin-top: 15px; color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.2);">
                <div id="love-counter" style="font-size: 1.1em; font-weight: bold; margin-bottom: 8px;">
                    </div>
                <div id="daily-quote" style="font-size: 0.95em; opacity: 0.95; font-family: '楷体', cursive; background: rgba(255,255,255,0.2); padding: 5px 15px; border-radius: 15px; display: inline-block;">
                    </div>
            </div>
        </div>
    </div>

    <div class="search-wrapper">
        <div class="search-tabs">
            <div class="search-tab active" onclick="setSearch('baidu')" title="百度">🐾</div>
            <div class="search-tab" onclick="setSearch('google')" title="Google">🌏</div>
            <div class="search-tab" onclick="setSearch('bing')" title="Bing">🪁</div>
            <div class="search-tab" onclick="setSearch('bilibili')" title="B站">📺</div>
            <div class="search-tab" onclick="setSearch('zhihu')" title="知乎">🧠</div>
            <div class="search-tab" onclick="setSearch('xhs')" title="小红书">📕</div>
        </div>
        
        <form id="search-form" action="https://www.baidu.com/s" target="_blank" class="search-box">
            <input type="text" id="search-input" name="wd" class="search-input" placeholder="百度一下，你就知道..." autocomplete="off">
            <button type="submit" class="search-btn">🔍</button>
        </form>
    </div>

    <div id="main-container">
        <p style="color: #fff; text-align: center;">正在连接猪猪星球...</p>
    </div>

    <div class="split-section">
        <div class="zone-card">
            <div class="zone-title">👧 KK 的小地盘</div>
            <div class="links-grid" id="grid-kk">
                </div>
        </div>
        
        <div class="zone-card">
            <div class="zone-title">👦 GG 的小地盘</div>
            <div class="links-grid" id="grid-gg">
                </div>
        </div>
    </div>
    <button class="add-btn" onclick="openModal()">+</button>

    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <h2>添加新传送门 🚪</h2>
            <div class="input-group">
                <label>选择分类</label>
                <select id="categorySelect"></select>
            </div>
            <div class="input-group">
                <label>网站名称</label>
                <input type="text" id="siteName" placeholder="例如：B站">
            </div>
            <div class="input-group">
                <label>网址 (URL)</label>
                <input type="text" id="siteUrl" placeholder="https://...">
            </div>
            <div class="input-group">
                <label>图标 (Emoji)</label>
                <input type="text" id="siteIcon" placeholder="例如：📺" value="✨">
            </div>
            <div class="input-group" id="tokenGroup" style="display:none;">
                <label>GitHub Token (首次需要)</label>
                <input type="password" id="ghToken" placeholder="ghp_xxxx...">
            </div>
            <div id="status-msg"></div>
            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn btn-confirm" onclick="saveToGithub()">保存 🚀</button>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
