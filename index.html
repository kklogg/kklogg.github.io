<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的猪猪导航 🐷</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="header-section">
        <div class="piggy-icon" id="piggy" onclick="triggerPigRain()">🐷</div>
        <h1>GitHub 猪猪主页</h1>
    </div>

    <form action="https://www.baidu.com/s" target="_blank" class="search-box">
        <input type="text" name="wd" class="search-input" placeholder="搜点什么鸭..." autocomplete="off">
        <button type="submit" class="search-btn">🔍</button>
    </form>

    <div id="main-container">
        <p style="color: #fff; text-align: center;">正在连接猪猪星球...</p>
    </div>

    <button class="add-btn" onclick="openModal()">+</button>

    <div class="modal-overlay" id="addModal">
        <div class="modal">
            <h2>添加新传送门 🚪</h2>
            <div class="input-group">
                <label>选择分类</label>
                <select id="categorySelect"></select>
            </div>
            <div class="input-group">
                <label>网站名称</label>
                <input type="text" id="siteName" placeholder="例如：B站">
            </div>
            <div class="input-group">
                <label>网址 (URL)</label>
                <input type="text" id="siteUrl" placeholder="https://...">
            </div>
            <div class="input-group">
                <label>图标 (Emoji)</label>
                <input type="text" id="siteIcon" placeholder="例如：📺" value="✨">
            </div>
            <div class="input-group" id="tokenGroup" style="display:none;">
                <label>GitHub Token (首次需要)</label>
                <input type="password" id="ghToken" placeholder="ghp_xxxx...">
            </div>
            <div id="status-msg"></div>
            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="closeModal()">取消</button>
                <button class="btn btn-confirm" onclick="saveToGithub()">保存 🚀</button>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
